name: Check source
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Prepare assets and check TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare local assets
        run: npm run assets
      - name: Synthesize original audio
        run: npm run audio
      - name: Check TypeScript
        run: npm run typecheck
