name: Check source
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Prepare assets and check TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare local assets
        run: npm run assets
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio mixing dependency
        run: python -m pip install -r requirements-audio.txt
      - name: Verify local HTTP exercise
        run: npm run range
      - name: Mix ACE-Step music and original foley
        run: npm run audio
      - name: Check TypeScript
        run: npm run typecheck
